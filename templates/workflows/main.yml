# Store and content pushes.
#
# One file, three independent jobs — each gated on the paths that concern
# it, so a metadata merge never touches screenshots and a data merge never
# touches either. Combining the *push* of text and screenshots into one
# fastlane call is what double-uploads (MIGRATE.md gotchas); separate jobs
# calling separate lanes keeps that separation intact.
#
# Branch rules differ per job, and that difference is the point (PLAYBOOK §5):
#   - metadata + screenshots also run on release/* pushes, because App Store
#     text has to be in App Store Connect BEFORE you submit — and the merge
#     to main now happens after Apple approves, which would be far too late.
#   - deploy-data runs on main only. Content goes live the instant it
#     deploys, with no review in between, so it must wait until the build
#     that understands it is actually approved.
#
# The manual button takes a `job` input so you can still run one of these
# on its own, exactly as the separate workflows allowed.
name: Main

on:
  push:
    branches: [main, 'release/**']
    paths:
      - "fastlane/metadata/**"
      - "fastlane/Deliverfile"
      - "fastlane/screenshots/**"
      - "Data/**"
      - "App/Resources/config.json"
      - "firebase.json"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: all
        options: [all, metadata, screenshots, hosting]

permissions:
  contents: read

jobs:
  # Decides which jobs run.
  #
  # Diffing only happens on main. On a release branch the first push has
  # nothing to diff against — the branch did not exist a moment earlier —
  # so store content simply always syncs there. That is what you want
  # anyway: pushing a release branch means preparing a listing, and
  # re-sending identical text to Apple costs nothing.
  #
  # On workflow_dispatch there is no diff either, so the `job` input decides.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      metadata: ${{ steps.decide.outputs.metadata }}
      screenshots: ${{ steps.decide.outputs.screenshots }}
      hosting: ${{ steps.decide.outputs.hosting }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          filters: |
            metadata:
              - 'fastlane/metadata/**'
              - 'fastlane/Deliverfile'
            screenshots:
              - 'fastlane/screenshots/**'
            data:
              - 'Data/**'
              - 'firebase.json'
            config:
              - 'App/Resources/config.json'
              - 'firebase.json'

      - name: Decide what to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${{ inputs.job }}"
            for j in metadata screenshots hosting; do
              if [ "$WANT" = "all" ] || [ "$WANT" = "$j" ]; then
                echo "$j=true" >> "$GITHUB_OUTPUT"
              else
                echo "$j=false" >> "$GITHUB_OUTPUT"
              fi
            done
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            # Release branch: always sync the listing, never deploy content.
            echo "metadata=true" >> "$GITHUB_OUTPUT"
            echo "screenshots=true" >> "$GITHUB_OUTPUT"
            echo "hosting=false" >> "$GITHUB_OUTPUT"
          else
            echo "metadata=${{ steps.filter.outputs.metadata }}" >> "$GITHUB_OUTPUT"
            echo "screenshots=${{ steps.filter.outputs.screenshots }}" >> "$GITHUB_OUTPUT"
            # Config and data share one site and one atomic deploy, so either
            # one changing restages and republishes the whole site.
            if [ "${{ steps.filter.outputs.config }}" = "true" ] || [ "${{ steps.filter.outputs.data }}" = "true" ]; then
              echo "hosting=true" >> "$GITHUB_OUTPUT"
            else
              echo "hosting=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # Push App Store metadata (TEXT ONLY) to App Store Connect.
  # Runs on main and on release/* — the text must land before you submit.
  store-metadata:
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: store-metadata
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Push metadata to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane metadata

  # Sync screenshots (IMAGES ONLY) to App Store Connect.
  # Runs on main and on release/* — same reason as metadata.
  store-screenshots:
    needs: changes
    if: needs.changes.outputs.screenshots == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: store-screenshots
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Sync screenshots to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane screenshots

  # Publishes the very same config.json the app ships with, so the bundled and
  # served copies cannot drift. main only: config takes effect on the next
  # launch for flags, but the maintenance and force-update gates read it during
  # startup, so it must not go live ahead of the build it describes.
  # ONE Hosting site means ONE deploy. A Hosting deploy atomically replaces the
  # whole site: any file absent from the staged directory is DELETED from the
  # live site. Two jobs each staging their own half — one config.json, one the
  # data bundles — means whichever deploys last silently removes the other's
  # files. Verified on a preview channel: staging both gave config.json 200 and
  # manifest.json 200; re-staging config.json alone left manifest.json at 404.
  #
  # So config and data deploy together, from a single staging step that emits
  # the complete site. Splitting them again reintroduces the bug.
  #
  # {{ Data/build.py must stage EVERYTHING the site serves, config.json
  #    included. An app with no hosted data still needs it — see the template
  #    in this repo. Secret: FIREBASE_SERVICE_ACCOUNT (Hosting Admin only).
  #    Rollback: `firebase hosting:rollback`. }}
  deploy-hosting:
    needs: changes
    if: |
      needs.changes.outputs.hosting == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-hosting
      cancel-in-progress: false   # never cancel a deploy midway
    steps:
      - uses: actions/checkout@v7

      - name: Stage the complete site
        run: cd Data && python3 build.py --clean

      - name: Verify the staged site is complete
        run: |
          # Deploying a half-built site deletes whatever is missing. Catch that
          # here, where it costs nothing, rather than on the live site.
          [ -f _hosting/config.json ] || {
            echo "::error::_hosting/config.json missing — Data/build.py must stage the whole site, config included"
            exit 1
          }
          python3 -c "import json;json.load(open('_hosting/config.json'))" || {
            echo "::error::staged config.json is not valid JSON"; exit 1; }

          # manifest.json is optional: an app may host config and nothing else.
          if [ -f _hosting/manifest.json ]; then
            python3 -c "import json;json.load(open('_hosting/manifest.json'))" || {
              echo "::error::staged manifest.json is not valid JSON"; exit 1; }
            echo "manifest staged"
          else
            echo "no manifest.json staged — this app hosts config only"
          fi
          echo "Staged $(find _hosting -type f | wc -l) file(s)"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ github.token }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: "{{FIREBASE_PROJECT_ID}}"
          channelId: live

      # A green deploy is not proof the file is being served. Hosting also
      # reports success before its CDN stops serving the previous copy, so
      # both checks retry against a cache-busted URL.
      - name: Smoke test — the live site serves what we shipped
        run: |
          BASE="https://{{FIREBASE_PROJECT_ID}}.web.app"
          LOCAL=$(python3 -c "import json;print(json.load(open('App/Resources/config.json'))['configVersion'])")

          for attempt in $(seq 1 10); do
            SERVED=$(curl -sSf -H 'Cache-Control: no-cache' \
                       "$BASE/config.json?ci=${GITHUB_RUN_ID:-0}-$attempt" || true)
            REMOTE=$(printf '%s' "$SERVED" \
                       | python3 -c "import json,sys;print(json.load(sys.stdin)['configVersion'])" 2>/dev/null || true)
            [ -n "$REMOTE" ] && [ "$REMOTE" = "$LOCAL" ] && break
            echo "attempt $attempt: serving ${REMOTE:-<no valid JSON>}, want $LOCAL — waiting"
            sleep 6
          done
          [ "$LOCAL" = "$REMOTE" ] || {
            echo "::error::served configVersion $REMOTE does not match shipped $LOCAL after 60s"; exit 1; }
          echo "Serving configVersion $REMOTE"

          if [ ! -f _hosting/manifest.json ]; then
            echo "Smoke test passed: configVersion $REMOTE (no hosted data for this app)"
            exit 0
          fi

          for attempt in $(seq 1 10); do
            MANIFEST=$(curl -sSf -H 'Cache-Control: no-cache' \
                         "$BASE/manifest.json?ci=${GITHUB_RUN_ID:-0}-$attempt" || true)
            printf '%s' "$MANIFEST" | python3 -c "import json,sys; json.load(sys.stdin)" >/dev/null 2>&1 && break
            echo "attempt $attempt: manifest not readable yet — waiting"
            sleep 6
          done
          printf '%s' "$MANIFEST" | python3 -c "import json,sys; json.load(sys.stdin)" || {
            echo "::error::manifest.json at $BASE is not valid JSON after 60s"; exit 1; }

          # Every bundle the manifest names must actually be served. A manifest
          # pointing at a missing pack is exactly what a partial deploy leaves
          # behind, and the app cannot recover from it.
          echo "$MANIFEST" | python3 -c "import json,sys;[print(i['bundle']) for i in json.load(sys.stdin)['items']]" \
            | while read -r BUNDLE; do
                curl -sSfI "$BASE${BUNDLE}" > /dev/null || {
                  echo "::error::manifest names $BUNDLE but it is not served"; exit 1; }
              done

          COUNT=$(echo "$MANIFEST" | python3 -c "import json,sys;print(len(json.load(sys.stdin)['items']))")
          echo "Smoke test passed: configVersion $REMOTE, manifest valid, all $COUNT bundle(s) reachable"
